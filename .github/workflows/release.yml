name: Release

# Publish to npm when a version tag (v0.2.0) is pushed, or by hand.
# Auth: npm trusted publishing (OIDC, no stored token) once this workflow is
# registered as the package's trusted publisher on npmjs.com; otherwise an
# NPM_TOKEN repository secret (granular, publish, bypass 2FA) is used.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Test, build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5+.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          test "$pkg" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }

      - run: npm test

      - run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
